name: Cloudflare IP Auto Updater

on:
  # 定时触发：每天北京时间上午 8 点运行一次 (UTC 0:00)
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update-ips:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖项
        run: |
          python -m pip install --upgrade pip
          # 如果您的项目里有 requirements.txt，可以直接用下面这行：
          if [ -f linux_py/requirements.txt ]; then pip install -r linux_py/requirements.txt; fi
          # 或者直接手动安装脚本需要的常见依赖（如 tqdm、requests 等）：
          pip install tqdm requests

      - name: 运行优选 IP 脚本 (Linux 版本)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd linux_py
          python update.py

      - name: 自动提交并推送结果到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add best_ips.txt full_ips.txt README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动更新 Cloudflare 优选 IP 节点 [skip ci]" && git push)
